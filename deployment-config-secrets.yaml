apiVersion: apps/v1
kind: Deployment
metadata:
  name: trial-k8s
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trial-k8s
  template:
    metadata:
      labels:
        app: trial-k8s
    spec:
      containers:
        - name: trial-k8s
          image: spring-boot-fresh:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: host
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: db_name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password